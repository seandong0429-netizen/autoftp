# Windows 上自动打包 AutoFTP 为单文件 exe，并发布到 Releases
name: build-exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: |
          pyinstaller --noconfirm --onefile --windowed --name AutoFTP gui_app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoFTP-windows
          path: dist/AutoFTP.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AutoFTP.exe
